<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
  </defs>
  <!-- Background Card -->
  <rect width="512" height="512" rx="128" fill="url(#grad)" />
  
  <!-- Crossed Fork and Knife / Utensils Icon -->
  <g fill="none" stroke="#ffffff" stroke-linecap="round" stroke-linejoin="round" stroke-width="32">
    <!-- Fork -->
    <path d="M160 120 v100 a40 40 0 0 0 80 0 v-100" />
    <path d="M200 120 v140" />
    <path d="M200 260 v130" />
    <!-- Knife -->
    <path d="M320 120 c0 0 32 40 32 100 h-32 v170" />
  </g>
  
  <!-- Sparkle Accent -->
  <circle cx="380" cy="130" r="18" fill="#f59e0b" />
</svg>
